<ion-content>
  <main class="welcome-page">
    <section class="welcome-copy">
      <div class="brand-row">
        <span class="brand-mark" aria-hidden="true">U</span><span class="brand-name">UBER</span>
      </div>
      <p class="eyebrow">VIAJES PARA TU DÍA A DÍA</p>
      <h1>Muévete por tu ciudad.</h1>
      <p class="description">Solicita un viaje, sigue tu ubicación en el mapa y llega a tu destino.</p>
    </section>
    <section class="welcome-panel" aria-label="Acceso a tu cuenta">
      <h2>¿Listo para salir?</h2>
      <p>Entra a tu cuenta o crea un perfil para empezar.</p>
      <div class="welcome-actions">
        <ion-button expand="block" routerLink="/login">Iniciar sesión</ion-button>
        <ion-button expand="block" fill="outline" routerLink="/register">Crear cuenta</ion-button>
      </div>
    </section>
  </main>
</ion-content>

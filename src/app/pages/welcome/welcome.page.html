<ion-content>
  <main class="welcome-page">
    <section class="welcome-card">
      <div class="brand-row">
        <span class="brand-mark" aria-hidden="true">R</span><span class="brand-name">RUMBO</span>
      </div>
      <p class="eyebrow">MOVILIDAD HECHA PARA TU CIUDAD</p>
      <h1>Tu ciudad, un poco más cerca.</h1>
      <p class="description">Conecta trayectos cotidianos con viajes sencillos, claros y a tu ritmo.</p>
      <div class="route-stamp" aria-hidden="true">
        <span class="route-stop start"></span><span class="route-path"></span><span class="route-stop end"></span>
        <span class="route-caption">ORIGEN <span>DESTINO</span></span>
      </div>
      <div class="welcome-actions">
        <ion-button expand="block" routerLink="/login">Entrar a Rumbo <span aria-hidden="true">↗</span></ion-button>
        <ion-button expand="block" fill="outline" routerLink="/register">Crear cuenta</ion-button>
      </div>
      <p class="welcome-note">Para quienes conducen y para quienes van.</p>
    </section>
  </main>
</ion-content>

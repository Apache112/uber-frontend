<ion-header>
  <ion-toolbar>
    <ion-title>Rumbo · acceso</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="login-container">
    <section class="login-intro">
      <div class="brand-row">
        <span class="brand-mark" aria-hidden="true">R</span><span class="brand-name">RUMBO</span>
      </div>
      <p class="eyebrow">TU PRÓXIMO TRAYECTO</p>
      <h1>Qué bueno tenerte de vuelta.</h1>
      <p>Accede a tu espacio y continúa tu camino.</p>
    </section>
    <ion-list lines="none">
      <ion-item>
        <ion-input
          label="Correo o teléfono"
          labelPlacement="stacked"
          type="text"
          [(ngModel)]="loginData.login"
          placeholder="ejemplo@correo.com"
        ></ion-input>
      </ion-item>

      <ion-item class="ion-margin-top">
        <ion-input
          label="Contraseña"
          labelPlacement="stacked"
          type="password"
          [(ngModel)]="loginData.password"
          placeholder="********"
        ></ion-input>
      </ion-item>
    </ion-list>

    <ion-text color="danger" *ngIf="errorMessage">
      <p class="ion-padding-start">{{ errorMessage }}</p>
    </ion-text>

    <div class="ion-margin-top">
      <ion-button expand="block" (click)="onLogin()">Ingresar</ion-button>
      <ion-button expand="block" fill="clear" [routerLink]="['/register']">¿No tienes cuenta? Regístrate</ion-button>
      <ion-button expand="block" fill="clear" [routerLink]="['/welcome']">Volver al inicio</ion-button>
    </div>
  </div>
</ion-content>

<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Uber - Panel del cliente</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <main class="dashboard-container">
    <section class="welcome">
      <p class="eyebrow">UBER</p>
      <h1>¡Bienvenido!</h1>
      <p>Tu sesión está iniciada. Aquí podrás consultar tu actividad como cliente.</p>
    </section>

    <ion-card>
      <ion-card-content>
        <h2>Historial de viajes</h2>
        <p>Revisa los viajes asociados a tu cuenta.</p>
        <ion-button expand="block" [routerLink]="['/trip-history']">
          Ver mis viajes
        </ion-button>
      </ion-card-content>
    </ion-card>
  </main>
</ion-content>
